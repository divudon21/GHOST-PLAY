name: Build APKs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Assemble split + universal APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble release (split ABI + universal)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p output
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} output/ \;
          ls -lh output

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ghost-play-apks
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
